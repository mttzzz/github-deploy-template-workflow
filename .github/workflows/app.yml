name: deploy template
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # helm_atomic: деплой ждёт готовности подов (`helm upgrade --wait`, до helm_timeout), и следующий пуш не
  # должен его отменять: SIGINT посреди ожидания оставляет релиз в pending-upgrade, откат не успевает
  # дойти до конца. Поэтому такие деплои встают в очередь друг за другом. Без helm_atomic — прежнее
  # поведение (устаревший деплой отменяется следующим пушем).
  cancel-in-progress: ${{ !inputs.helm_atomic }}

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
        default: 'web-app'
      helm_chart:
        required: false
        type: string
        default: 'app'
      chart_version:
        description: 'Chart version semver-констрейнт (1.x = последний 1.x из zot)'
        required: false
        type: string
        default: '1.x'
      params:
        description: 'Parameters for Helm Chart'
        required: false
        type: string
      with_submodules:
        description: 'Checkout submodules'
        required: false
        type: boolean
        default: false
      cache_mode:
        description: 'Cache mode'
        required: false
        type: string
        default: 'min'
      # Выжимка стандартных раннеров (бенч 2026-07, mailer): build приложения на раннере
      # быстрее multi-stage docker-билда (нет docker-налога на install), а КЭШИ НЕ ИСПОЛЬЗУЮТСЯ
      # НАМЕРЕННО — restore из сети (gha/registry/actions-cache) стабильно дороже холодной
      # пересборки (bun install ~4-6s против 8-22s restore). Требования к репо в host-режиме:
      # package.json script `build:host` (полный build до .output) + `Dockerfile.host`
      # (тонкая упаковка .output). Контекст сборки — корень репо (docker_context игнорируется).
      build_mode:
        description: 'Стратегия сборки: docker (default, multi-stage Dockerfile) | host (build на раннере, docker только пакует .output через Dockerfile.host).'
        required: false
        type: string
        default: 'docker'
      # Только для build_mode=host: версия Bun, которой раннер ставит зависимости и собирает .output.
      # Рантайм образа пинует свою (FROM в Dockerfile.host / базе), а `latest` резолвится в момент
      # сборки: в день релиза Bun сборка шла бы новой версией, исполнение — старой, и смена версии
      # приезжала бы в прод без коммита в репо. Репо с пином передаёт ту же X.Y.Z, что в образе.
      # Default `latest` — прежнее поведение для репо, которые версию не пинуют.
      bun_version:
        description: 'Версия Bun для build_mode=host (bun-version у setup-bun): точная X.Y.Z, как у рантайма образа. Default latest.'
        required: false
        type: string
        default: 'latest'
      # Только для build_mode=host. Требует в проекте experimental.buildCache: true в nuxt.config
      # И обязательной проверки манифеста в build:host (см. ниже) — известен баг nuxt#33999,
      # где протухший кэш даёт 404 на чанках (белый экран). Без проверки НЕ включать.
      build_cache:
        description: 'Кэшировать инкрементальный build-кэш Nuxt между запусками (node_modules/.cache/nuxt).'
        required: false
        type: boolean
        default: false
      build_runner:
        description: 'Runner for build-docker job'
        required: false
        type: string
        default: 'ubuntu-latest'
      sentry_project:
        description: 'Sentry project slug (если отличается от app_name). Пусто → fallback на app_name. Пусто + нет SENTRY_AUTH_TOKEN → sentry-finalize пропускается.'
        required: false
        type: string
        default: ''
      sentry_finalize:
        description: 'Финализировать Sentry-релиз после деплоя. Сервисы без своего Sentry-проекта выставляют false — иначе каждый их ран получает notice «SENTRY_AUTH_TOKEN не передан».'
        required: false
        type: boolean
        default: true
      # Монорепо: путь контекста сборки + Dockerfile + суффикс repo для образа — раздельные деплои
      # app (корень) и микросервисов (services/<name>/) одним шаблоном. Default = поведение app:
      # context=., Dockerfile в корне, без суффикса → другие проекты не затронуты.
      docker_context:
        description: 'Build context (монорепо-сервис → services/<name>).'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Путь к Dockerfile от корня репо.'
        required: false
        type: string
        default: 'Dockerfile'
      image_suffix:
        description: 'Суффикс repo образа (напр. "-doc-extractor"): итог = REGISTRY_NAME/<repo><suffix>:latest. НЕ секрет — registry-хост подставляется внутри job из secrets.REGISTRY_NAME, не через caller.'
        required: false
        type: string
        default: ''
      # Opt-in (ai.pushka.biz): публикация immutable-ассетов билда (_nuxt/_fonts) в Spaces CDN
      # ШАГОМ ПАЙПЛАЙНА после build, а не на старте пода (инцидент 31.07: blind PUT 1548 файлов
      # из пода = 88s и crash-loop под startup probe; с раннера ~12s при concurrency=32).
      # Только build_mode=host: шаг работает по .output/public в workspace. Требует в репо
      # scripts/publish-assets.ts и secrets DO_SPACES_KEY/DO_SPACES_SECRET.
      publish_assets_cdn:
        description: 'Публиковать ассеты билда в Spaces CDN шагом после host-build.'
        required: false
        type: boolean
        default: false
      publish_assets_bucket:
        description: 'Бакет Spaces для ассетов (при publish_assets_cdn=true).'
        required: false
        type: string
        default: ''
      publish_assets_url:
        description: 'Endpoint Spaces (host, без https://).'
        required: false
        type: string
        default: 'fra1.digitaloceanspaces.com'

      # Выкатка с ожиданием (opt-in). Без неё `helm upgrade` возвращается, как только манифесты применены, и
      # CrashLoop нового образа даёт зелёный деплой. С ней helm ждёт готовности подов НОВОЙ ревизии и при
      # провале откатывает релиз: красный деплой = релиз не сменился, и уведомление в Telegram говорит об этом
      # прямо. cancel-in-progress при этом выключен (см. concurrency). Заодно включается якорь отката
      # `:deployed` (шаги Anchor и Pin): прежний digest не теряет тег и после отката.
      helm_atomic:
        description: 'helm upgrade с ожиданием готовности и откатом при провале: --wait --timeout helm_timeout + откат (Helm 3: --atomic, Helm 4: --rollback-on-failure; флаг выбирается по версии helm на раннере). Отключает cancel-in-progress: деплои встают в очередь. Включает якорь отката :deployed.'
        required: false
        type: boolean
        default: false
      helm_timeout:
        description: 'Потолок ожидания для helm_atomic (--timeout, Go-длительность) на КАЖДЫЙ helm upgrade деплоя; откат после провала ждёт готовности подов с тем же потолком. kubeconfig из prepare-k8s живёт 3600 с, поэтому сборка + 2 × helm_timeout на каждый релиз (ожидание и откат) должны в них укладываться: при 15m и одном релизе сборка может занять до 30 минут.'
        required: false
        type: string
        default: '15m'

      # Переиспользование работающего образа (opt-in). Сервис монорепо собирается из корня, и широкий фильтр путей
      # (общий лок-файл, корневой package.json, общие пакеты) запускает выкатку от правок, которые его образ не
      # меняют. Вызывающий считает отпечаток входов образа (у ai.pushka.biz — scripts/docker/image-inputs-hash.ts);
      # если тот же отпечаток стоит меткой `deploy.inputs-hash` на образе под :deployed, сборка пропускается и
      # выкатывается тот же digest: helm upgrade с тем же образом и values под не трогает. Иначе образ собирается
      # как обычно и получает эту метку. Нужен якорь :deployed — поэтому только вместе с helm_atomic, и только
      # build_mode=docker. Пустой вход — прежнее поведение.
      inputs_hash:
        description: 'Отпечаток входов образа (считает вызывающий). Совпал с меткой deploy.inputs-hash образа :deployed — сборка пропускается, выкатывается тот же digest. Только с helm_atomic=true и build_mode=docker.'
        required: false
        type: string
        default: ''

    secrets:
      HELM_REPO:
        required: true
      REGISTRY_NAME:
          required: true
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
          required: true  
      DO_TOKEN:
          required: true  
      TELEGRAM_TOKEN:
          required: true  
      TELEGRAM_CHAT_ID:
          required: true  
      BUILD_ARGS:
          required: false
      GIT_TOKEN:
          required: false
      PARAMS:
          description: 'Parameters for Helm Chart!!'
          required: false
      DOCKERHUB_USERNAME:
          required: false
      DOCKERHUB_TOKEN:
          required: false
      SENTRY_AUTH_TOKEN:
          description: 'Sentry user/org auth token для finalize-job (releases new/set-commits/finalize/deploys). Если не передан — finalize-job no-op.'
          required: false
      DO_SPACES_KEY:
          description: 'Spaces access key для publish_assets_cdn. Без пары шаг публикации падает явно.'
          required: false
      DO_SPACES_SECRET:
          description: 'Spaces secret key для publish_assets_cdn.'
          required: false

jobs:
  build-docker:
    runs-on: ${{ inputs.build_runner }}
    defaults:
      run:
        shell: bash
    outputs:
      docker_tag: ${{ steps.export_tag.outputs.tag }}
      # Digest только что запушенного образа. Деплой ссылается на образ по digest, а не по
      # :latest — тогда pod spec меняется каждый деплой и роллаут стартует сам, без лишнего
      # `kubectl rollout restart` (−5s). Теги при этом не копятся, а старые слои подчищает GC
      # регистри. Digest НЕ секрет; полный ref собирается в deploy-job, где доступен
      # secrets.REGISTRY_NAME (GitHub зануляет любой output со значением секрета).
      # Ретрай-шаги идут в цепочке ПОСЛЕ своей первой попытки: если та упала на пуше, digest
      # несёт повтор. Пустой output ложен для `||`, поэтому побеждает первый непустой.
      # Переиспользованный образ (inputs_hash совпал с :deployed) — первым: сборки тогда не было.
      image_digest: ${{ steps.reuse.outputs.hit == 'true' && steps.reuse.outputs.digest || steps.push_docker.outputs.digest || steps.push_docker_retry.outputs.digest || steps.push_host.outputs.digest || steps.push_host_retry.outputs.digest }}
      image_reused: ${{ steps.reuse.outputs.hit }}
      duration: ${{ steps.duration.outputs.time }}
      validation_error: ${{ steps.validate.outputs.error }}
    steps:
      - name: Validate required parameters
        id: validate
        env:
          INPUTS_HASH: ${{ inputs.inputs_hash }}
        run: |
          ERRORS=""
          if [[ "${{ inputs.with_submodules }}" == "true" && -z "${{ secrets.GIT_TOKEN }}" ]]; then
            ERRORS="${ERRORS}❌ with_submodules=true, но GIT_TOKEN не передан\n"
          fi
          # Значение входа — через env, а не подстановкой в текст скрипта: строка вызывающего не исполняется.
          if [[ -n "$INPUTS_HASH" ]]; then
            if [[ ! "$INPUTS_HASH" =~ ^[0-9a-f]{64}$ ]]; then
              ERRORS="${ERRORS}❌ inputs_hash должен быть sha256 в hex (64 символа)\n"
            fi
            if [[ "${{ inputs.helm_atomic }}" != "true" ]]; then
              ERRORS="${ERRORS}❌ inputs_hash требует helm_atomic=true: без якоря :deployed сравнивать не с чем\n"
            fi
            if [[ "${{ inputs.build_mode }}" == "host" ]]; then
              ERRORS="${ERRORS}❌ inputs_hash поддержан только для build_mode=docker\n"
            fi
          fi
          if [[ -n "$ERRORS" ]]; then
            echo "error<<EOF" >> $GITHUB_OUTPUT
            echo -e "$ERRORS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "::error::Validation failed"
            exit 1
          fi

      - name: Start timer
        id: start
        run: echo "time=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Checkout deploying repository
        uses: actions/checkout@v6
        with:
          submodules: ${{ inputs.with_submodules }}
          fetch-depth: 1
          # GIT_TOKEN нужен только для сабмодулей в чужих приватных репо; без него — откат на
          # встроенный GITHUB_TOKEN, которого достаточно для checkout своего (даже приватного) репо.
          token: ${{ secrets.GIT_TOKEN || github.token }}

      - name: Validate host build prerequisites
        if: inputs.build_mode == 'host'
        run: |
          if [[ ! -f Dockerfile.host ]]; then
            echo "::error::build_mode=host, но Dockerfile.host отсутствует в корне репо"
            exit 1
          fi
          if ! jq -e '.scripts["build:host"]' package.json > /dev/null; then
            echo "::error::build_mode=host, но в package.json нет script build:host"
            exit 1
          fi

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY_NAME}}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: Set up Docker Buildx
        if: inputs.build_mode != 'host'
        uses: docker/setup-buildx-action@v4

      # Тот же отпечаток входов, что у образа под :deployed, — образ уже собран и работает: сборку пропускаем и
      # выкатываем его digest. Любая неудача чтения (нет :deployed, нет метки, реестр не ответил) — обычная сборка:
      # ошибка здесь стоит лишней пересборки, а не пропущенной выкатки. :latest перевешивается на тот же digest
      # (копия манифеста в реестре, без слоёв): по нему дорожки синхронизируют образ с продом.
      - name: Reuse deployed image (inputs_hash)
        id: reuse
        if: inputs.inputs_hash != '' && inputs.build_mode != 'host'
        env:
          REF: ${{ secrets.REGISTRY_NAME }}/${{ github.repository }}${{ inputs.image_suffix }}
          WANT: ${{ inputs.inputs_hash }}
          BUILD_ARGS: ${{ secrets.BUILD_ARGS }}
        run: |
          # BUILD_ARGS идут в сборку, но в отпечаток входов НЕ входят: при непустых значениях образ не переиспользуем.
          if [[ -n "$BUILD_ARGS" ]]; then
            echo "::notice::BUILD_ARGS заданы — их значения в отпечаток не входят, собираю образ"
            exit 0
          fi
          # Digest и образ читаем ОДИН раз по digest: два запроса к изменяемому тегу :deployed могли бы разойтись
          # (между ними тег перевешивает другая группа очереди), а stderr buildx не должен мешать разбору JSON.
          if ! digest=$(docker buildx imagetools inspect "${REF}:deployed" --format '{{json .Manifest}}' 2>/tmp/reuse.err | jq -er '.digest'); then
            echo "::notice::digest :deployed не прочитан — собираю образ: $(head -c 200 /tmp/reuse.err)"
            exit 0
          fi
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::notice::digest :deployed непохож на digest — собираю образ: ${digest}"
            exit 0
          fi
          if ! image=$(docker buildx imagetools inspect "${REF}@${digest}" --format '{{json .Image}}' 2>/tmp/reuse.err); then
            echo "::notice::${digest} не прочитан — собираю образ: $(head -c 200 /tmp/reuse.err)"
            exit 0
          fi
          # Метка ищется на любой глубине вывода imagetools: форма этого вывода менялась между версиями buildx
          # (конфигурация образа прямо в .Image, карта по платформам, .single), и жёсткий путь .config.Labels дал бы
          # have="" всегда — reuse молча выключился бы, а выкатки шли бы как раньше. Нет метки — "" (обычная сборка).
          have=$(jq -r '[.. | objects | .["deploy.inputs-hash"]? // empty] | first // ""' <<<"$image" 2>/dev/null || true)
          # Метка берётся с ТОГО ЖЕ digest, который выкатывается: так переиспользование не может взять образ,
          # которого в кластере нет.
          if [[ "$have" != "$WANT" ]]; then
            echo "отпечаток входов изменился (было ${have:-нет метки}, стало ${WANT}) — собираю образ"
            exit 0
          fi
          echo "входы образа не изменились: выкатываю работающий ${digest} без сборки"
          if ! docker buildx imagetools create --prefer-index=false --tag "${REF}:latest" "${REF}@${digest}"; then
            echo "::warning:::latest не перевешен на ${digest}: синхронизация дорожек возьмёт прошлую сборку"
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "hit=true" >> "$GITHUB_OUTPUT"

      # host-режим: builder создаётся мгновенно, а его буст (pull buildkit-образа +
      # старт контейнера, ~8-9s) идёт в фоне параллельно с bun install / build:host.
      # build-push-action подхватит текущий builder; если буст ещё идёт — дождётся.
      - name: Prepare buildx in background (host)
        if: inputs.build_mode == 'host'
        run: |
          docker buildx create --name host-packer --use > /dev/null
          nohup docker buildx inspect --bootstrap > /dev/null 2>&1 &

      # Метка отпечатка входов образа. При пустом inputs_hash выход ПУСТ, и образ получает ровно те же метки,
      # что и раньше: чужие проекты на @master (десять) ничего не замечают. Метка идёт через inputs metadata-action
      # отдельной строкой, а не дописывается к его выводу: пустая строка метки («Invalid label ''») уронила бы
      # сборку всем, кто отпечатка не передаёт.
      - name: Метка отпечатка входов
        id: extra_label
        env:
          WANT: ${{ inputs.inputs_hash }}
        run: |
          if [ -n "$WANT" ]; then
            echo "value=deploy.inputs-hash=$WANT" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata (tags, labels) for Docker
        id: meta        
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.REGISTRY_NAME }}/${{ github.repository }}${{ inputs.image_suffix }}
          tags: |
           type=raw,value=latest
          labels: ${{ steps.extra_label.outputs.value }}

      - name: Export Docker tag safely
        id: export_tag
        run: |
          # Устанавливаем тег "latest" принудительно
          echo "tag=latest" >> $GITHUB_OUTPUT
          echo "Using tag: latest"

      # Пуш в реестр — единственный шаг, который штатно рвётся не по нашей вине: реестр может
      # оборвать сессию блоб-аплоада (zot до 2026-08 резал ЛЮБОЙ запрос дольше 60s дефолтным
      # http.readTimeout и удалял .uploads/ — клиент получал blob upload unknown; DOCR отдаёт то
      # же на своих сбоях). buildx ретраев не делает. Поэтому: попытка + повтор по её провалу.
      # Слои уже в кэше, повтор стоит секунды. Цена — настоящий сбой сборки прогоняется дважды.
      - name: Build and push Docker image
        id: push_docker
        if: inputs.build_mode != 'host' && steps.reuse.outputs.hit != 'true'
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.docker_context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ secrets.REGISTRY_NAME }}/${{ github.repository }}${{ inputs.image_suffix }}:latest
          # Метка отпечатка входов: по ней следующая выкатка узнаёт, что образ можно не пересобирать (шаг reuse).
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ secrets.BUILD_ARGS }}
            SENTRY_RELEASE=${{ github.sha }}
          # Scope на приложение: без него все сервисы монорепо пишут в один кэш GHA (`buildkit`) и
          # затирают друг другу индекс — omp-chat ai.pushka.biz попадал в кэш в 2 сборках из 6.
          # Замер 01.10: шаг сборки с попаданием 53–62 с, с промахом 297–309 с — держит его пуш
          # ~1 ГБ пересобранных слоёв (148 с), экспорт кэша (104–116 с) идёт параллельно пушу и
          # кончается раньше. Откат 0735fcb касался упаковки build_mode=host, этот шаг он снял заодно.
          cache-from: type=gha,scope=${{ inputs.app_name }}
          cache-to: type=gha,mode=${{ inputs.cache_mode }},scope=${{ inputs.app_name }}

      - name: Build and push Docker image (retry)
        id: push_docker_retry
        if: inputs.build_mode != 'host' && steps.push_docker.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.docker_context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ secrets.REGISTRY_NAME }}/${{ github.repository }}${{ inputs.image_suffix }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ secrets.BUILD_ARGS }}
            SENTRY_RELEASE=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.app_name }}
          cache-to: type=gha,mode=${{ inputs.cache_mode }},scope=${{ inputs.app_name }}

      # === build_mode: host — build приложения на раннере, docker только пакует .output ===
      - name: Set up Bun
        if: inputs.build_mode == 'host'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun_version }}

      - name: Install dependencies (host)
        if: inputs.build_mode == 'host'
        run: bun install --frozen-lockfile --ignore-scripts

      # Инкрементальный кэш Nuxt (experimental.buildCache). Восстанавливаем ПОСЛЕ install:
      # кэш лежит внутри node_modules. Бенч mailer 2026-07: билд 36s → 22s, restore 1s
      # (кэш 12MB — на порядок меньше docker-слоёв, потому и окупается). Ключ включает
      # лок-файл: смена зависимостей инвалидирует кэш (Nuxt всё равно пересобрал бы всё).
      - name: Restore Nuxt build cache (host)
        if: inputs.build_mode == 'host' && inputs.build_cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/nuxt
          key: nuxt-buildcache-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            nuxt-buildcache-${{ hashFiles('bun.lock') }}-
            nuxt-buildcache-

      - name: Build application (host)
        if: inputs.build_mode == 'host'
        env:
          NODE_ENV: production
          SENTRY_RELEASE: ${{ github.sha }}
          BUILD_ARGS: ${{ secrets.BUILD_ARGS }}
        run: |
          # BUILD_ARGS (VAR=val построчно) — те же пары, что в docker-режиме уходят
          # build-args'ами; здесь становятся env процесса сборки (в пределах шага).
          while IFS= read -r line; do
            [[ -z "${line// }" ]] && continue
            export "${line?}"
          done <<< "$BUILD_ARGS"
          bun run build:host

      # Пуш ТОЛЬКО через container-driver buildkit (Prepare buildx выше): движковый
      # пушер dockerd (docker push и buildx на default-builder) DOCR отвергает
      # с manifest invalid независимо от формата манифеста — проверено бенчем.
      - name: Package and push image (host)
        id: push_host
        if: inputs.build_mode == 'host'
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.host
          push: true
          tags: ${{ secrets.REGISTRY_NAME }}/${{ github.repository }}${{ inputs.image_suffix }}:latest
          labels: ${{ steps.meta.outputs.labels }}

      # Здесь повтор дёшев вдвойне: bun-сборка уже прошла отдельным шагом выше, docker только
      # пакует готовый .output — ретраится ровно упаковка и заливка слоёв.
      - name: Package and push image (host, retry)
        id: push_host_retry
        if: inputs.build_mode == 'host' && steps.push_host.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.host
          push: true
          tags: ${{ secrets.REGISTRY_NAME }}/${{ github.repository }}${{ inputs.image_suffix }}:latest
          labels: ${{ steps.meta.outputs.labels }}

      # Публикация immutable-ассетов ПОСЛЕДНИМ шагом build-job: deploy-job needs build-docker,
      # поэтому падение заливки = красный деплой ДО helm — поды не получат трафик, пока чанков
      # их билда нет в бакете (ordering-инвариант). Полный blind PUT всегда (НЕ delta): повторная
      # заливка неизменных чанков — это mark для GC-sweep'а (LastModified живых файлов свежий).
      # cwd=.output: publish-assets.ts читает ./public относительно cwd (как в старом pod-старте).
      - name: Publish build assets to CDN (host)
        if: inputs.build_mode == 'host' && inputs.publish_assets_cdn
        working-directory: .output
        env:
          NUXT_DO_SPACES_BUCKET: ${{ inputs.publish_assets_bucket }}
          NUXT_DO_SPACES_URL: ${{ inputs.publish_assets_url }}
          NUXT_DO_SPACES_KEY: ${{ secrets.DO_SPACES_KEY }}
          NUXT_DO_SPACES_SECRET: ${{ secrets.DO_SPACES_SECRET }}
          PUBLISH_CONCURRENCY: '32'
        run: bun ../scripts/publish-assets.ts

      - name: Calculate duration
        id: duration
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - ${{ steps.start.outputs.time }}))
          echo "time=${DURATION}s" >> $GITHUB_OUTPUT

  # Подготовка Kubernetes/Helm выполняется ПАРАЛЛЕЛЬНО со сборкой Docker образа
  prepare-k8s:
    runs-on: ubuntu-latest
    outputs:
      helm_params: ${{ steps.prepare_params.outputs.helm_params }}
      duration: ${{ steps.duration.outputs.time }}
    steps:
      - name: Start timer
        id: start
        run: echo "time=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Get kubeconfig via API (no doctl needed)
        run: |
          mkdir -p $HOME/.kube
          
          # Получаем cluster ID
          CLUSTER_ID=$(curl -s -X GET "https://api.digitalocean.com/v2/kubernetes/clusters" \
            -H "Authorization: Bearer ${{ secrets.DO_TOKEN }}" \
            -H "Content-Type: application/json" | jq -r '.kubernetes_clusters[] | select(.name=="main") | .id')
          
          echo "Cluster ID: $CLUSTER_ID"
          
          # Получаем kubeconfig с токеном (expiry 1 час = 3600 сек)
          curl -s -X GET "https://api.digitalocean.com/v2/kubernetes/clusters/${CLUSTER_ID}/kubeconfig?expiry_seconds=3600" \
            -H "Authorization: Bearer ${{ secrets.DO_TOKEN }}" \
            > $HOME/.kube/config
          
          chmod 600 $HOME/.kube/config
          echo "Kubeconfig downloaded successfully"
          kubectl cluster-info

      - name: Install Helm
        # На GitHub-hosted раннерах helm предустановлен — качаем только если его нет
        # (самостоятельный раннер / урезанный образ). Экономит ~7s биллинга на прогон.
        run: command -v helm > /dev/null || curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Login to OCI Registry (zot)
        # Чарты — OCI-артефакты в zot; chartmuseum выведен из эксплуатации.
        run: helm registry login zot.pushka.biz --username ${{ secrets.REGISTRY_USERNAME }} --password ${{ secrets.REGISTRY_PASSWORD }}


      - name: Prepare Helm parameters
        id: prepare_params
        run: |
          validate_probe_delay() {
            local source_name="$1"
            local source_data="$2"

            while IFS= read -r raw_line; do
              # Trim spaces and skip empty lines.
              line="$(echo "$raw_line" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
              [[ -z "$line" ]] && continue

              key="${line%%=*}"
              value="${line#*=}"
              case "$key" in
                app.livenessProbe.initialDelaySeconds|app.readinessProbe.initialDelaySeconds)
                  if ! [[ "$value" =~ ^[0-9]+$ ]]; then
                    echo "::error::Invalid $key value in $source_name: '$value'. Expected integer (e.g. 10)."
                    exit 1
                  fi
                  ;;
              esac
            done <<< "$source_data"
          }

          # Decode input parameters
          PARAMS_STR="${{ inputs.params }}"
          echo "Decoding input params: $PARAMS_STR"
          validate_probe_delay "inputs.params" "$PARAMS_STR"
          INPUT_PARAMS=$(echo "$PARAMS_STR" | grep -v '^\s*$' | awk '{print "--set", $0}' ORS=' ')
          
          # Decode secret parameters
          SECRET_PARAMS_STR="${{secrets.PARAMS}}"
          echo "Decoding secrets params: $SECRET_PARAMS_STR"
          validate_probe_delay "secrets.PARAMS" "$SECRET_PARAMS_STR"
          SECRET_PARAMS=$(echo "$SECRET_PARAMS_STR" | grep -v '^\s*$' | awk '{print "--set", $0}' ORS=' ')
          
          # Combine parameters (without image, will be added in deploy)
          BASE_PARAMS="$INPUT_PARAMS $SECRET_PARAMS --set app.name=${{ inputs.app_name }}"
          
          echo "helm_params<<EOF" >> $GITHUB_OUTPUT
          echo "$BASE_PARAMS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Якорь отката (opt-in: helm_atomic). Сборка (job build-docker) перевесит :latest на новый digest ДО вердикта
      # helm, а прод тем временем работает на прежнем digest, который под держит по `@sha256` (imagePullPolicy:
      # Always — каждый запуск контейнера спрашивает реестр). zot (gc: true, gcDelay: 1h, retention не задан)
      # удаляет манифесты без тега, поэтому после отката helm (или упавшей выкатки) прежний digest терял бы
      # единственный тег и через 1–25 часов исчезал: рестарт, скейл или выселение пода давали бы ImagePullBackOff.
      # Тег :deployed ставит job deploy после УСПЕШНОГО helm upgrade. Здесь — один раз, для первой сборки образа
      # с helm_atomic, у которого :deployed ещё нет: на digest, который РЕАЛЬНО крутится в кластере (образ контейнера
      # приложения в Deployment, а при деплое «по :latest» — imageID контейнера в поде), а не на :latest: тот мог
      # уехать вперёд, если прошлый деплой упал или был отменён. Порядок относительно сборки не важен: digest
      # берётся из кластера, а zot держит безтеговые манифесты ещё gcDelay. Сбой реестра отличается от «тега нет»:
      # на сбое (после трёх попыток) шаг красный, а не молча переставляет якорь.
      - name: Login to Container Registry (якорь отката)
        if: ${{ inputs.helm_atomic }}
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY_NAME }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Anchor deployed image as :deployed (bootstrap)
        if: ${{ inputs.helm_atomic }}
        env:
          REPO_REF: ${{ secrets.REGISTRY_NAME }}/${{ github.repository }}${{ inputs.image_suffix }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          # Проверка манифеста с повтором: единичный сбой реестра или сети не должен красить prepare-k8s.
          # 0 — манифест есть, 1 — реестр ответил «нет такого», 2 — реестр не ответил за три попытки.
          probe() {
            local out attempt
            for attempt in 1 2 3; do
              if out=$(docker buildx imagetools inspect "$1" 2>&1); then
                return 0
              fi
              if grep -qiE 'not found|manifest unknown|name unknown' <<< "$out"; then
                return 1
              fi
              echo "::warning::imagetools inspect $1: попытка $attempt из 3: $out" >&2
              if (( attempt < 3 )); then sleep $((attempt * 2)); fi
            done
            echo "::error::реестр не ответил на проверку $1: $out" >&2
            return 2
          }

          rc=0
          probe "${REPO_REF}:deployed" || rc=$?
          if [[ $rc -eq 0 ]]; then
            echo "якорь :deployed уже есть — ничего не делаем"
            exit 0
          elif [[ $rc -ne 1 ]]; then
            exit 1
          fi

          # Что реально крутится в кластере. helm ставит образ по @sha256; деплой «по :latest» (digest пуст) задаёт
          # его тегом — тогда digest берём из imageID работающего пода. Контейнер приложения выбирается ПО ИМЕНИ (чарт
          # app называет его app.name, как и Deployment): kubelet отдаёт containerStatuses отсортированными по имени, а
          # не в порядке spec, поэтому у пода с сайдкаром (app.sidecars) [0] — чужой контейнер. Ошибка kubectl (в
          # отличие от «Deployment нет») роняет шаг: молча пропустить якорь при недоступном API значило бы вернуть
          # риск, ради которого он есть.
          IMAGE=$(kubectl get deployment "$APP_NAME" --ignore-not-found -o jsonpath="{.spec.template.spec.containers[?(@.name==\"${APP_NAME}\")].image}")
          DIGEST=$(grep -oE 'sha256:[0-9a-f]{64}$' <<< "$IMAGE" || true)
          if [[ -z "$DIGEST" && -n "$IMAGE" ]]; then
            IDS=$(kubectl get pods -l "app=$APP_NAME" -o jsonpath="{.items[*].status.containerStatuses[?(@.name==\"${APP_NAME}\")].imageID}")
            DIGEST=$(tr ' ' '\n' <<< "$IDS" | grep -oE 'sha256:[0-9a-f]{64}$' | head -n 1 || true)
          fi
          if [[ -z "$DIGEST" ]]; then
            echo "::notice::в кластере образа ${APP_NAME} нет (Deployment или контейнер с таким именем не найден: имя Deployment — app.name из values, оно должно совпадать с app_name) — якорь поставит первый успешный деплой"
            exit 0
          fi

          rc=0
          probe "${REPO_REF}@${DIGEST}" || rc=$?
          if [[ $rc -eq 1 ]]; then
            echo "::warning::digest ${DIGEST} из кластера (${APP_NAME}) уже удалён из реестра — якорь поставить не на что, ближайший успешный деплой заменит образ"
            exit 0
          elif [[ $rc -ne 0 ]]; then
            exit 1
          fi

          for attempt in 1 2 3; do
            if docker buildx imagetools create --prefer-index=false --tag "${REPO_REF}:deployed" "${REPO_REF}@${DIGEST}"; then
              echo "якорь :deployed → ${DIGEST} (digest из кластера, первая сборка образа с helm_atomic)"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "::error::не удалось поставить якорь :deployed на ${DIGEST}"
          exit 1

      - name: Package k8s config for deploy
        run: |
          mkdir -p /tmp/k8s-bundle
          cp -r $HOME/.kube /tmp/k8s-bundle/kube
          cp -r $HOME/.config/helm /tmp/k8s-bundle/config-helm 2>/dev/null || true
          cp -r $HOME/.cache/helm /tmp/k8s-bundle/cache-helm 2>/dev/null || true
          echo "Bundle contents:"
          ls -la /tmp/k8s-bundle/
          
      - name: Upload k8s bundle
        uses: actions/upload-artifact@v7
        with:
          name: k8s-bundle
          path: /tmp/k8s-bundle
          retention-days: 1

      - name: Calculate duration
        id: duration
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - ${{ steps.start.outputs.time }}))
          echo "time=${DURATION}s" >> $GITHUB_OUTPUT

  # Deploy теперь только скачивает артефакты и деплоит - максимально быстро!
  deploy:
    needs: [build-docker, prepare-k8s]
    runs-on: ubuntu-latest
    outputs:
      duration: ${{ steps.duration.outputs.time }}
      pin_failed: ${{ steps.pin_anchor.outputs.failed }}
    steps:
      - name: Start timer
        id: start
        run: echo "time=$(date +%s)" >> $GITHUB_OUTPUT

      # Checkout нужен для современного пути: deploy/values.yaml из репо приложения.
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download k8s bundle
        uses: actions/download-artifact@v8
        with:
          name: k8s-bundle
          path: /tmp/k8s-bundle

      - name: Restore k8s config
        run: |
          cp -r /tmp/k8s-bundle/kube $HOME/.kube
          chmod 600 $HOME/.kube/config
          mkdir -p $HOME/.config $HOME/.cache
          cp -r /tmp/k8s-bundle/config-helm $HOME/.config/helm 2>/dev/null || true
          cp -r /tmp/k8s-bundle/cache-helm $HOME/.cache/helm 2>/dev/null || true

      - name: Deploy to Kubernetes with Helm
        run: |
          # image-ref собираем ЗДЕСЬ: registry-хост (secrets.REGISTRY_NAME) доступен напрямую внутри
          # deploy-job. Протащить его через caller params/outputs нельзя — GitHub зануляет любой
          # output/param, содержащий ЗНАЧЕНИЕ secret, и helm_params уходит пустым (так ронялся прод).
          REPO_REF="${{ secrets.REGISTRY_NAME }}/${{ github.repository }}${{ inputs.image_suffix }}"
          DIGEST="${{ needs.build-docker.outputs.image_digest }}"

          # Основной путь: ссылка по digest. Спека пода меняется каждый деплой → роллаут
          # стартует сам. Fallback на :latest + явный рестарт — если digest почему-то пуст
          # (иначе получили бы битый image-ref и сломанный деплой).
          if [[ -n "$DIGEST" ]]; then
            IMAGE_REF="${REPO_REF}@${DIGEST}"
            NEED_RESTART=""
          else
            echo "::warning::digest пуст — деплой по :latest с явным рестартом (fallback)"
            IMAGE_REF="${REPO_REF}:${{ needs.build-docker.outputs.docker_tag }}"
            NEED_RESTART="1"
          fi

          # helm_atomic: ожидание готовности подов новой ревизии и откат при провале. Откат у Helm 3 — --atomic,
          # у Helm 4 он переименован в --rollback-on-failure (--atomic там — устаревший алиас с предупреждением,
          # а Helm 3 нового имени не знает), поэтому флаг выбирается по мажору helm на раннере: ubuntu-latest
          # переезжает с Ubuntu 24.04 (Helm 3) на 26.04 (Helm 4) в ноябре 2026, встретятся оба. --wait указан
          # явно: у Helm 4 голый --wait = стратегия watcher. Старые поды, получившие SIGTERM, ожидания не держат
          # (readyReplicas считаются по новой ревизии), поэтому долгий дренаж деплой не задерживает.
          HELM_WAIT=()
          if [[ "${{ inputs.helm_atomic }}" == "true" ]]; then
            HELM_MAJOR=$(helm version --template '{{.Version}}' | sed -E 's/^v?([0-9]+)\..*/\1/')
            if [[ "$HELM_MAJOR" -ge 4 ]]; then ROLLBACK_FLAG="--rollback-on-failure"; else ROLLBACK_FLAG="--atomic"; fi
            HELM_WAIT=("$ROLLBACK_FLAG" --wait --timeout "${{ inputs.helm_timeout }}")
            echo "helm_atomic: helm v${HELM_MAJOR}: ${HELM_WAIT[*]}"
          fi

          VALUES_FILE="deploy/values${{ inputs.image_suffix }}.yaml"
          # --history-max 3: Helm хранит каждую ревизию релиза секретом (по умолчанию 10 на релиз). 2026-10-17 в
          # кластере было 334 таких секрета, 22 МиБ, и API-сервер DOKS держит их все в памяти; на откат хватает трёх.
          if [ -f "$VALUES_FILE" ]; then
            # Современный путь: типизированный values-файл из репо приложения.
            # Источник истины — файл; input params при этом игнорируются.
            # Монорепо: файл на сервис — deploy/values<image_suffix>.yaml.
            echo "$VALUES_FILE найден — деплой через -f (input params игнорируются)"
            helm upgrade ${{ inputs.app_name }} oci://zot.pushka.biz/charts/${{ inputs.helm_chart }} --version "${{ inputs.chart_version }}" -i --history-max 3 -f "$VALUES_FILE" --set app.image=${IMAGE_REF} "${HELM_WAIT[@]}"

            # Доп. релизы того же образа (воркеры в отдельных подах): deploy/release<image_suffix>.<имя>.yaml.
            # <имя> из имени файла = имя helm-релиза = app.name внутри файла (по нему же идёт рестарт
            # deployment). Файлов нет — цикл не выполняется ни разу, поведение прежнее. Удаление файла
            # релиз из кластера НЕ снимает: `helm uninstall <имя>` — руками.
            shopt -s nullglob
            for f in deploy/release${{ inputs.image_suffix }}.*.yaml; do
              name=$(basename "$f" .yaml)
              name=${name#release${{ inputs.image_suffix }}.}
              echo "$f найден — доп. релиз $name того же образа"
              helm upgrade "$name" oci://zot.pushka.biz/charts/${{ inputs.helm_chart }} --version "${{ inputs.chart_version }}" -i --history-max 3 -f "$f" --set app.image=${IMAGE_REF} "${HELM_WAIT[@]}"
              if [[ -n "$NEED_RESTART" ]]; then
                kubectl rollout restart deployment "$name"
              fi
            done
            shopt -u nullglob
          else
            FULL_PARAMS="${{ needs.prepare-k8s.outputs.helm_params }} --set app.image=${IMAGE_REF}"
            echo "Full Params for Helm: $FULL_PARAMS"

            helm upgrade ${{ inputs.app_name }} oci://zot.pushka.biz/charts/${{ inputs.helm_chart }} --version "${{ inputs.chart_version }}" -i --history-max 3 $FULL_PARAMS "${HELM_WAIT[@]}"
          fi

          if [[ -n "$NEED_RESTART" ]]; then
            kubectl rollout restart deployment ${{ inputs.app_name }}
          fi

      # Якорь отката: после УСПЕШНОГО helm upgrade ставим тег :deployed на задеплоенный digest (при провале или откате
      # шаг не выполняется, и :deployed остаётся на прежнем digest — того, что работает в кластере). Это копия
      # манифеста внутри реестра без загрузки слоёв: `imagetools create` с одним источником и --prefer-index=false —
      # побайтовая копия, digest не меняется. Контекст — в шаге Anchor deployed image в prepare-k8s.
      - name: Login to Container Registry (якорь отката)
        if: ${{ inputs.helm_atomic }}
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY_NAME }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Pin deployed image as :deployed (якорь отката)
        id: pin_anchor
        if: ${{ inputs.helm_atomic }}
        env:
          REPO_REF: ${{ secrets.REGISTRY_NAME }}/${{ github.repository }}${{ inputs.image_suffix }}
          DIGEST: ${{ needs.build-docker.outputs.image_digest }}
        run: |
          if [[ -z "$DIGEST" ]]; then
            echo "::warning::digest пуст (деплой шёл по :latest) — якорь :deployed не ставим"
            exit 0
          fi
          for attempt in 1 2 3; do
            if docker buildx imagetools create --prefer-index=false --tag "${REPO_REF}:deployed" "${REPO_REF}@${DIGEST}"; then
              echo "якорь :deployed → ${DIGEST}"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          # Деплой уже прошёл и жив, поэтому провал якоря — не красный деплой: шаг помечает его выходом, а Telegram
          # добавляет предупреждение (образ держится только тегом latest до следующей сборки).
          echo "::warning::не удалось поставить тег :deployed на ${DIGEST}"
          echo "failed=true" >> "$GITHUB_OUTPUT"

      - name: Calculate duration
        id: duration
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - ${{ steps.start.outputs.time }}))
          echo "time=${DURATION}s" >> $GITHUB_OUTPUT

  # Sentry release finalize + auto-archive предыдущих:
  # - releases new            → создаёт release (no-op если уже создан implicitly SDK или vite-plugin'ом)
  # - releases set-commits    → линкует коммиты для suspect-commits в issues (--auto нужен .git → checkout). Non-fatal.
  # - releases finalize       → выставляет dateReleased → release получает "checkmark" вместо "Finalize" в UI
  # - releases deploys ... new → отдельная запись в Releases → Deploys (production env)
  # - archive prior releases  → API list open releases проекта → archive всё кроме current. Active filter в UI чист.
  # Пропускается если sentry_finalize=false (сервисы без Sentry-проекта), SENTRY_AUTH_TOKEN
  # не передан или нет sentry_project/app_name.
  # Для Nuxt-проектов часть этого уже делает sentryVitePlugin на build — повтор безвреден (idempotent API).
  sentry-finalize:
    needs: [deploy, build-docker]
    # Образ переиспользован (inputs_hash совпал) — новой сборки не было, значит и релиза Sentry для этого SHA нет:
    # создавать пустой релиз и архивировать прежние незачем.
    if: ${{ inputs.sentry_finalize && needs.deploy.result == 'success' && needs.build-docker.outputs.image_reused != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (для sentry-cli releases set-commits --auto — нужен локальный .git)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Finalize + archive prior Sentry releases
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: pushka-biz
          SENTRY_PROJECT: ${{ inputs.sentry_project != '' && inputs.sentry_project || inputs.app_name }}
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::notice::SENTRY_AUTH_TOKEN не передан — sentry-finalize пропущен"
            exit 0
          fi
          if [ -z "$SENTRY_PROJECT" ]; then
            echo "::notice::sentry_project/app_name пустой — sentry-finalize пропущен"
            exit 0
          fi
          curl -sL https://sentry.io/get-cli/ | bash
          sentry-cli releases new "$SENTRY_RELEASE"
          sentry-cli releases set-commits "$SENTRY_RELEASE" --auto --ignore-missing \
            || echo "::warning::set-commits --auto не сработал (non-fatal — пропускаем suspect-commits)"
          sentry-cli releases finalize "$SENTRY_RELEASE"
          sentry-cli releases deploys "$SENTRY_RELEASE" new -e production

          # Auto-archive: список всех open releases проекта → archive всё кроме current.
          # API возвращает releases с участием project; archive выставляет status=archived
          # → Active filter в UI остаётся только с current release.
          echo "Archiving prior releases for project $SENTRY_PROJECT..."
          curl -sfH "Authorization: Bearer $SENTRY_AUTH_TOKEN" \
            "https://sentry.io/api/0/projects/$SENTRY_ORG/$SENTRY_PROJECT/releases/?per_page=100" \
            | jq -r '.[].version' \
            | while read -r v; do
              if [ -n "$v" ] && [ "$v" != "$SENTRY_RELEASE" ]; then
                sentry-cli releases archive "$v" \
                  && echo "  archived $v" \
                  || echo "::warning::archive $v failed (non-fatal)"
              fi
            done

  notify:
    needs: [build-docker, prepare-k8s, deploy]
    if: ${{ always() && (needs.build-docker.result != 'cancelled' || needs.prepare-k8s.result != 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - name: Prepare commit info
        id: commit_info
        env:
          RAW_MSG: ${{ github.event.head_commit.message }}
          RAW_SHA: ${{ github.sha }}
        run: |
          # Надёжно: только subject-строка, truncate до 200 символов, HTML-escape.
          # Через env вниз по шагам, чтобы в bash не было GHA-интерполяции
          # (иначе любые " ` $ из коммита ломают MESSAGE="...").
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import os, html
          raw = os.environ.get("RAW_MSG", "") or ""
          # Первая непустая строка коммита
          first = next((ln.strip() for ln in raw.splitlines() if ln.strip()), "")
          if len(first) > 200:
              first = first[:200].rstrip() + "…"
          if not first:
              first = (os.environ.get("RAW_SHA", "") or "commit")[:7]
          print("html=" + html.escape(first, quote=True))
          PY

      - name: Send Validation Error to Telegram
        if: ${{ needs.build-docker.outputs.validation_error != '' }}
        run: |
          MESSAGE="⚠️ <b>Validation Failed</b> ⚠️

          📦 <b>Repo:</b> <code>${{ github.repository }}</code>
          🌿 <b>Branch:</b> <code>${{ github.ref_name }}</code>

          <b>Ошибки конфигурации:</b>
          ${{ needs.build-docker.outputs.validation_error }}

          <i>Деплой не запущен. Исправьте конфигурацию и запустите заново.</i>"
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=$MESSAGE" \
            --data-urlencode "parse_mode=HTML"

      - name: Determine failed step
        id: failed_step
        if: ${{ needs.build-docker.outputs.validation_error == '' && (needs.build-docker.result == 'failure' || needs.prepare-k8s.result == 'failure' || needs.deploy.result == 'failure') }}
        run: |
          if [[ "${{ needs.build-docker.result }}" == "failure" ]]; then
            echo "step=🐳 Build Docker" >> $GITHUB_OUTPUT
            echo "job=build-docker" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.prepare-k8s.result }}" == "failure" ]]; then
            echo "step=⚙️ Prepare Kubernetes" >> $GITHUB_OUTPUT
            echo "job=prepare-k8s" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.deploy.result }}" == "failure" ]]; then
            echo "step=🚀 Deploy to Kubernetes" >> $GITHUB_OUTPUT
            echo "job=deploy" >> $GITHUB_OUTPUT
          fi

      - name: Send Failure Telegram Message
        if: ${{ needs.build-docker.outputs.validation_error == '' && (needs.build-docker.result == 'failure' || needs.prepare-k8s.result == 'failure' || needs.deploy.result == 'failure') }}
        env:
          COMMIT_HTML: ${{ steps.commit_info.outputs.html }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          HELM_ATOMIC: ${{ inputs.helm_atomic }}
        run: |
          # Пояснение под «Failed Step» при helm_atomic: упавший релиз откатывается на прежнюю ревизию, то есть
          # релиз не сменился (без helm_atomic helm не ждёт подов и этой строки нет).
          NOTE=""
          if [[ "$HELM_ATOMIC" == "true" && "$DEPLOY_RESULT" == "failure" ]]; then
            NOTE=$'\n'"↩️ <i>helm atomic: упавший релиз откатывается на прежнюю ревизию (helm history).</i>"
          fi

          MESSAGE="🔴 <b>DEPLOYMENT FAILED</b> · <code>${{ inputs.app_name }}</code>

          👤 <b>Author:</b> <code>${{ github.actor }}</code>
          📦 <b>Repo:</b> <code>${{ github.repository }}</code>
          🌿 <b>Branch:</b> <code>${{ github.ref_name }}</code>

          ────────────────────
          💬 <b>Commit:</b>
          <a href=\"https://github.com/${{ github.repository }}/commit/${{ github.sha }}\">$COMMIT_HTML</a>

          ────────────────────
          ❌ <b>Failed Step:</b>
          <code>${{ steps.failed_step.outputs.step }}</code>${NOTE}

          ────────────────────
          🔗 <a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View Logs</a>"
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=$MESSAGE" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true"
  
      - name: Send Success Telegram Message
        if: ${{ needs.deploy.result == 'success' }}
        env:
          COMMIT_HTML: ${{ steps.commit_info.outputs.html }}
          PIN_FAILED: ${{ needs.deploy.outputs.pin_failed }}
          IMAGE_REUSED: ${{ needs.build-docker.outputs.image_reused }}
        run: |
          # Якорь отката не поставлен: деплой жив, но образ держится только тегом latest, и если следующая выкатка
          # упадёт или откатится, он потеряет тег (пустой выход — якорь поставлен или helm_atomic выключен).
          PIN_NOTE=""
          if [[ "$PIN_FAILED" == "true" ]]; then
            PIN_NOTE=$'\n\n'"⚠️ <b>Якорь отката :deployed не поставлен</b> — образ держится только тегом latest: если следующая выкатка упадёт или откатится, он потеряет тег, и zot удалит его через 1–25 ч"
          fi
          # Входы образа не изменились (inputs_hash): выкачен работающий digest, поды не перезапускались, если не
          # менялись values.
          REUSE_NOTE=""
          if [[ "$IMAGE_REUSED" == "true" ]]; then
            REUSE_NOTE=$'\n\n'"♻️ <b>Образ не пересобирался</b> — входы те же, что у работающего; поды перезапускаются только при смене values"
          fi

          MESSAGE="🟢 <b>DEPLOY SUCCESSFUL</b> · <code>${{ inputs.app_name }}</code>

          👤 <b>Author:</b> <code>${{ github.actor }}</code>
          📦 <b>Repo:</b> <code>${{ github.repository }}</code>
          🚀 <b>App:</b> <code>${{ inputs.app_name }}</code> (образ <code>${{ github.repository }}${{ inputs.image_suffix }}</code>)

          ────────────────────
          💬 <b>Commit:</b>
          <a href=\"https://github.com/${{ github.repository }}/commit/${{ github.sha }}\">$COMMIT_HTML</a>

          ────────────────────
          ⏱️ <b>Performance:</b>
          ├ 🐳 Build: <code>${{ needs.build-docker.outputs.duration }}</code>
          ├ ☸️ Prepare: <code>${{ needs.prepare-k8s.outputs.duration }}</code>
          └ 📤 Deploy: <code>${{ needs.deploy.outputs.duration }}</code>

          🔗 <a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View Action Run</a>${REUSE_NOTE}${PIN_NOTE}"
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=$MESSAGE" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true"
